<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News & Blog - MSKTF</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-100">
    <div id="header-placeholder"></div>

    <main class="mx-auto max-w-5xl px-6 pt-24 pb-16">
      <!-- Standard Header -->
      <section class="bg-blue-600 dark:bg-blue-900/40 py-16 md:py-24 mb-12 text-white relative overflow-hidden text-center rounded-2xl">
        <div class="absolute right-0 top-0 opacity-10 translate-x-1/4 -translate-y-1/4">
            <i class="fi fi-br-news text-[300px]"></i>
        </div>
        <div class="relative z-10 px-6">
          <h1 class="text-4xl md:text-6xl font-black tracking-tighter uppercase" data-i18n="newsBlogTitle">
            News & Updates
          </h1>
        </div>
      </section>

      <!-- Standard Breadcrumbs -->
      <nav class="mb-12 flex text-sm text-gray-500 dark:text-gray-400" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3 text-[10px] font-bold uppercase tracking-widest">
          <li class="inline-flex items-center">
            <a href="index.html" class="hover:text-blue-600 dark:hover:text-white transition-colors" data-i18n="navHome">Home</a>
          </li>
          <li>
            <div class="flex items-center text-gray-400 dark:text-gray-600">
              <svg class="w-3 h-3 mx-1 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"></path></svg>
              <span data-i18n="navNewsBlog">News & Blog</span>
            </div>
          </li>
        </ol>
      </nav>

      <!-- Standard Content Grid -->
      <section id="articles-grid" class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
        <!-- Initial Skeleton Loaders -->
        <div id="loading-indicator" class="col-span-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full">
          <div class="article-card flex flex-col">
            <div class="skeleton h-48 w-full rounded-t-lg"></div>
            <div class="flex flex-grow flex-col p-5">
              <div class="mb-3 flex items-center justify-between"><div class="skeleton h-4 w-16 rounded"></div><div class="skeleton h-4 w-24 rounded"></div></div>
              <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
              <div class="skeleton mb-4 h-4 w-full rounded"></div>
              <div class="mt-auto self-start"><div class="skeleton h-10 w-28 rounded-md"></div></div>
            </div>
          </div>
          <div class="article-card hidden md:flex flex-col">
            <div class="skeleton h-48 w-full rounded-t-lg"></div>
            <div class="flex flex-grow flex-col p-5">
              <div class="mb-3 flex items-center justify-between"><div class="skeleton h-4 w-16 rounded"></div><div class="skeleton h-4 w-24 rounded"></div></div>
              <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
              <div class="skeleton mb-4 h-4 w-full rounded"></div>
              <div class="mt-auto self-start"><div class="skeleton h-10 w-28 rounded-md"></div></div>
            </div>
          </div>
          <div class="article-card hidden lg:flex flex-col">
            <div class="skeleton h-48 w-full rounded-t-lg"></div>
            <div class="flex flex-grow flex-col p-5">
              <div class="mb-3 flex items-center justify-between"><div class="skeleton h-4 w-16 rounded"></div><div class="skeleton h-4 w-24 rounded"></div></div>
              <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
              <div class="skeleton mb-4 h-4 w-full rounded"></div>
              <div class="mt-auto self-start"><div class="skeleton h-10 w-28 rounded-md"></div></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Pagination Controls -->
      <nav id="pagination-controls" aria-label="Pagination" class="mt-12 flex justify-center"></nav>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="./src/articles-list.js"></script>
  </body>
</html>

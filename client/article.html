<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article - MSKTF</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-100">
    <div id="header-placeholder"></div>

    <!-- Reading Progress Bar -->
    <div id="reading-progress" class="fixed top-16 left-0 h-1 bg-blue-600 z-50 transition-all duration-100" style="width: 0%"></div>

    <main class="mx-auto max-w-5xl px-6 pt-24 pb-16">
      <!-- Standard Breadcrumbs -->
      <nav class="mb-12 flex text-sm text-gray-500 dark:text-gray-400" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3 text-[10px] font-bold uppercase tracking-widest">
          <li class="inline-flex items-center">
            <a href="index.html" class="hover:text-blue-600 dark:hover:text-white transition-colors" data-i18n="navHome">Home</a>
          </li>
          <li>
            <div class="flex items-center text-gray-400 dark:text-gray-600">
              <svg class="w-3 h-3 mx-1 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 0 010 1.414l-4 4a1 0 01-1.414 0z"></path></svg>
              <a href="articles.html" class="hover:text-blue-600 dark:hover:text-white transition-colors" data-i18n="navNewsBlog">News & Blog</a>
            </div>
          </li>
          <li aria-current="page">
            <div class="flex items-center text-gray-400 dark:text-gray-600">
              <svg class="w-3 h-3 mx-1 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 0 010 1.414l-4 4a1 0 01-1.414 0z"></path></svg>
              <span id="breadcrumb-title">Article</span>
            </div>
          </li>
        </ol>
      </nav>

      <!-- Article Content Area -->
      <div id="article-container" class="w-full">
        <!-- Modern Loading State -->
        <div id="article-loading" class="flex flex-col items-center justify-center py-20">
          <div class="relative w-16 h-16">
            <div class="absolute inset-0 rounded-full border-4 border-blue-100 dark:border-gray-700"></div>
            <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
          </div>
          <p class="mt-4 text-gray-500 font-medium animate-pulse" data-i18n="loadingArticles">Loading article...</p>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="./src/articles.js"></script>
  </body>
</html>

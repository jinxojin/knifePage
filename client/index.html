<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mongolian Sports Knife Throwing Federation</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-100">
    <div id="header-placeholder">
      <!-- Header will be loaded here by uiUtils.js -->
    </div>

    <main class="flex flex-col items-center">
      <!-- Hero Section -->
      <section
        class="relative mx-auto flex min-h-screen w-full max-w-full flex-col justify-center overflow-hidden text-left"
      >
        <div class="absolute inset-0 -z-10">
          <img
            src="/assets/hero-background.jpg"
            alt=""
            class="h-full w-full object-cover blur-md grayscale-[20%] brightness-75 transition-all duration-700"
          />
        </div>
        <div class="hero-gradient absolute inset-0 -z-10"></div>

        <div class="relative z-10 mx-auto w-full max-w-5xl px-6 py-16 md:py-24">
          <div class="animate-fade-in-up opacity-0" style="animation-delay: 0.2s;">
            <h1
              class="mb-6 text-4xl leading-tight font-extrabold text-white sm:text-5xl md:text-6xl lg:text-7xl tracking-tight"
              data-i18n="federationName"
            >
              Mongolian Sports <br class="hidden md:block"/>
              Knife Throwing Federation
            </h1>
          </div>
          
          <div class="animate-fade-in-up opacity-0" style="animation-delay: 0.4s;">
            <p
              class="mb-10 max-w-2xl text-xl font-light text-gray-200 md:text-2xl"
              data-i18n="federationSlogan"
            >
              <span class="border-l-4 border-yellow-500 pl-4">
                Preserving Tradition, Empowering Future
              </span>
            </p>
          </div>

          <div class="mt-10 flex flex-row gap-4 animate-fade-in-up opacity-0" style="animation-delay: 0.6s;">
            <a
              href="/competitions.html"
              class="btn btn-blue px-8 py-3 text-lg font-bold shadow-lg shadow-blue-900/20 transition-transform hover:scale-105"
              data-i18n="heroViewEvents"
            >
              View Events
            </a>
            <a
              href="#featured-articles"
              class="btn btn-gray bg-white/10 px-8 py-3 text-lg font-bold text-white backdrop-blur-md transition-transform hover:bg-white/20 hover:scale-105"
              data-i18n="heroContactUs"
            >
              Explore
            </a>
          </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce-slow text-white/50 transition-colors hover:text-white">
          <a href="#featured-articles" aria-label="Scroll down">
            <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
          </a>
        </div>
      </section>
      <!-- End Hero Section -->

      <!-- Featured Articles Section - NOW USING GRID for desktop -->
      <section
        id="featured-articles"
        class="mx-auto mt-8 w-full max-w-screen-xl px-4 pb-12 sm:px-6 lg:mt-12 lg:px-8"
      >
        <div class="grid grid-cols-1 gap-8 lg:grid-cols-3 lg:gap-10">
          <!-- Latest Competition -->
          <div class="flex flex-col">
            <!-- Use flex col to contain title and card -->
            <h3
              class="mb-3 text-2xl font-semibold"
              data-i18n="latestCompetition"
            >
              Latest Competition
            </h3>
            <hr class="mb-4 border-gray-300 dark:border-gray-600" />
            <!-- Replaces comp-divider -->
            <div
              id="highlight-competition"
              class="article-card flex flex-grow flex-col"
            >
              <div class="skeleton h-48 w-full rounded-t-lg"></div>
              <div class="flex flex-grow flex-col p-5">
                <div class="mb-3 flex items-center justify-between">
                  <div class="skeleton h-4 w-16 rounded"></div>
                  <div class="skeleton h-4 w-24 rounded"></div>
                </div>
                <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
                <div class="skeleton mb-2 h-4 w-full rounded"></div>
                <div class="skeleton mb-4 h-4 w-5/6 rounded"></div>
                <div class="mt-auto self-start">
                  <div class="skeleton h-10 w-28 rounded-md"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Latest News -->
          <div class="flex flex-col">
            <h3 class="mb-3 text-2xl font-semibold" data-i18n="latestNews">
              Latest News
            </h3>
            <hr class="mb-4 border-gray-300 dark:border-gray-600" />
            <div
              id="highlight-news"
              class="article-card flex flex-grow flex-col"
            >
              <div class="skeleton h-48 w-full rounded-t-lg"></div>
              <div class="flex flex-grow flex-col p-5">
                <div class="mb-3 flex items-center justify-between">
                  <div class="skeleton h-4 w-16 rounded"></div>
                  <div class="skeleton h-4 w-24 rounded"></div>
                </div>
                <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
                <div class="skeleton mb-2 h-4 w-full rounded"></div>
                <div class="skeleton mb-4 h-4 w-5/6 rounded"></div>
                <div class="mt-auto self-start">
                  <div class="skeleton h-10 w-28 rounded-md"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Latest Blog -->
          <div class="flex flex-col">
            <h3 class="mb-3 text-2xl font-semibold" data-i18n="latestBlog">
              Latest Blog Post
            </h3>
            <hr class="mb-4 border-gray-300 dark:border-gray-600" />
            <div
              id="highlight-blog"
              class="article-card flex flex-grow flex-col"
            >
              <div class="skeleton h-48 w-full rounded-t-lg"></div>
              <div class="flex flex-grow flex-col p-5">
                <div class="mb-3 flex items-center justify-between">
                  <div class="skeleton h-4 w-16 rounded"></div>
                  <div class="skeleton h-4 w-24 rounded"></div>
                </div>
                <div class="skeleton mb-3 h-6 w-3/4 rounded"></div>
                <div class="skeleton mb-2 h-4 w-full rounded"></div>
                <div class="skeleton mb-4 h-4 w-5/6 rounded"></div>
                <div class="mt-auto self-start">
                  <div class="skeleton h-10 w-28 rounded-md"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder">
      <!-- Footer will be loaded here by uiUtils.js -->
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
